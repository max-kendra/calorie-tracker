name: Build and push image

# Manual trigger only ("Run workflow" in the Actions tab, or `gh
# workflow run build.yml`) - matches the existing deploy script's own
# philosophy (see build-and-deploy.ps1: you decide when to deploy,
# nothing happens automatically on every push).
"on":
  workflow_dispatch:

jobs:
  build-and-push:
    # A genuinely native arm64 machine - no QEMU, no --platform flag,
    # no emulation of any kind. This is the whole point (see design
    # discussion): repeated QEMU failures on the local Windows +
    # Docker Desktop build path (cache corruption, a broken binfmt
    # registration, then a plain "exec format error" on a fresh pull)
    # aren't three unrelated bugs - they're the same underlying
    # fragility (QEMU's registration inside the Docker Desktop VM can
    # silently drop on a VM restart) surfacing three different ways.
    # Building on real hardware makes the whole category of failure
    # structurally impossible here, rather than something to keep
    # patching after each recurrence.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      # Required to push to this repo's own GHCR namespace using the
      # automatically-provided GITHUB_TOKEN below - no separate
      # secret to create or rotate for this step.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/ is its own separate repo (calorie-tracker-web), not part
      # of this one - on your own machine both are already cloned
      # side by side, so the Dockerfile's `COPY web/ ./` step always
      # had something there. A fresh Actions runner only checks out
      # THIS repo by default, so web/ genuinely doesn't exist here
      # unless explicitly checked out too (see design discussion -
      # "/web: not found" was this, not a build config problem).
      #
      # No token needed - calorie-tracker-web is public, so this reads
      # the same way anyone browsing it on github.com does, with no
      # auth at all (a token would only be needed for a PRIVATE repo).
      #
      # REPLACE <GITHUB_USERNAME> with your actual GitHub username/org
      # if calorie-tracker-web doesn't live under the same one this
      # workflow is running in.
      - name: Checkout web repo
        uses: actions/checkout@v4
        with:
          repository: max-kendra/calorie-tracker-web
          path: web

      # Required for the GHA cache (type=gha) used below - the
      # runner's default "docker" driver can build and push fine but
      # doesn't support that cache backend at all ("Cache export is
      # not supported for the docker driver"). This sets up a real
      # docker-container buildx builder instead.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest for the Pi to always pull, plus the commit SHA as
          # a second, immutable tag - lets you point docker-compose.yml
          # at an exact past build (e.g. to roll back) without
          # depending on :latest having stayed put, which it won't.
          tags: |
            ghcr.io/${{ github.repository_owner }}/calorie-tracker:latest
            ghcr.io/${{ github.repository_owner }}/calorie-tracker:${{ github.sha }}
          # Real layer caching across runs, same benefit local
          # buildx already had via Docker Desktop's own cache - GitHub
          # Actions' cache backend instead of a local one.
          cache-from: type=gha
          cache-to: type=gha,mode=max