services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    image: ghcr.io/max-kendra/calorie-tracker:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./easyocr_models:/app/easyocr_models
      - ./ocr_metrics:/app/ocr_metrics
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres-backup
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@hourly"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - /mnt/data/db-backups:/backups

  media-backup:
    image: alpine:3.20
    container_name: media-backup
    restart: unless-stopped
    volumes:
      - ./media:/data/media:ro
      - /mnt/data/media-backups:/backups
    command: >
      sh -c "while true; do
        tar -czf /backups/media-$$(date +%Y%m%d-%H%M%S).tar.gz -C /data media &&
        find /backups -name 'media-*.tar.gz' -mtime +30 -delete;
        sleep 86400;
      done"

volumes:
  postgres-data: