services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    container_name: api
    image: ghcr.io/max-kendra/calorie-tracker:latest
    pull_policy: always
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./media:/app/media
      - ./easyocr_models:/app/easyocr_models
      - ./ocr_metrics:/app/ocr_metrics
      - ./backup-status:/app/backup-status:ro
      - /mnt/data/calorie-tracker/db-backups:/app/db-backups:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres-backup
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@hourly"
      TZ: Europe/Paris
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - /mnt/data/calorie-tracker/db-backups:/backups

  offsite-backup:
    image: rclone/rclone:latest
    container_name: offsite-backup
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    entrypoint: /bin/sh
    environment:
      TZ: Europe/Paris
    volumes:
      - /mnt/data/calorie-tracker/rclone-config:/config/rclone
      - /mnt/data/calorie-tracker/db-backups:/rclone/db-backups:ro
      - ./media:/rclone/media:ro
      - ./backup-status:/status
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - -c
      - |
        while true; do
          err=$$(mktemp)
          if rclone copy /rclone/db-backups offsite:calorie-tracker/db-backups 2>"$$err" &&
             rclone copy /rclone/media offsite:calorie-tracker/media 2>>"$$err"; then
            date +%s > /status/offsite-last-success
            rm -f /status/offsite-error
            wait=86400
          else
            { echo "rclone failed:"; tail -c 300 "$$err"; } > /status/offsite-error
            wait=3600
          fi
          rm -f "$$err"
          sleep $$wait
        done

volumes:
  postgres-data: